<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 180" width="410" height="180" fill="none">
  <defs>
    <!-- Fonts -->
    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 11.5px;
        fill: #94a3b8;
        line-height: 16px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 9px;
        fill: #00f2fe;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070e"/>
      <stop offset="100%" stop-color="#0d0c1b"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="blur-bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="410" height="180" rx="16" fill="url(#card-bg)"/>
  
  <!-- Subtle background glow -->
  <circle cx="20" cy="20" r="40" fill="#00f2fe" opacity="0.08" filter="url(#blur-bg)"/>

  <!-- Double-Bezel Inner Core -->
  <rect x="5" y="5" width="400" height="170" rx="12" fill="#050409" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1.25"/>

  <!-- Left Icon Group -->
  <g transform="translate(24, 24)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#00f2fe" fill-opacity="0.05" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="1"/>
    
    <!-- Game Board / Cross-Grid Custom Icon (Path) -->
    <path d="M 12 10 L 24 10 M 12 18 L 24 18 M 12 26 L 24 26 M 10 12 L 10 24 M 18 12 L 18 24 M 26 12 L 26 24" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stones -->
    <circle cx="18" cy="18" r="3.5" fill="#00f2fe"/>
    <circle cx="26" cy="10" r="3.5" fill="#050409" stroke="#00f2fe" stroke-width="1.2"/>
  </g>

  <!-- Top-Right Link Indicator (Button-in-Button style) -->
  <g transform="translate(354, 24)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <path d="M 12 20 L 20 12 M 14 12 L 20 12 L 20 18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Description -->
  <text x="72" y="47" class="card-title">Rapfi</text>
  
  <g transform="translate(24, 76)">
    <text x="0" y="12" class="card-desc">High-performance Gomoku &amp; Caro engine in C++.</text>
    <text x="0" y="28" class="card-desc">Features custom BitBoard representations, alphabeta search,</text>
    <text x="0" y="44" class="card-desc">and NNUE evaluation for tactical position scoring.</text>
  </g>

  <!-- Footer Tags -->
  <!-- Tag 1: C++ -->
  <g transform="translate(24, 138)">
    <rect x="0" y="0" width="46" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="23" y="13" text-anchor="middle" class="tag-text" fill="#3b82f6">C++</text>
  </g>

  <!-- Tag 2: Engine -->
  <g transform="translate(76, 138)">
    <rect x="0" y="0" width="58" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="29" y="13" text-anchor="middle" class="tag-text" fill="#00f2fe">Engine</text>
  </g>

  <!-- Tag 3: AI Solver -->
  <g transform="translate(140, 138)">
    <rect x="0" y="0" width="68" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="34" y="13" text-anchor="middle" class="tag-text" fill="#a18cd1">AI Solver</text>
  </g>

  <!-- Tag 4: NNUE -->
  <g transform="translate(214, 138)">
    <rect x="0" y="0" width="50" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="25" y="13" text-anchor="middle" class="tag-text" fill="#ec4899">NNUE</text>
  </g>
</svg>
