<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 180" width="410" height="180" fill="none">
  <defs>
    <!-- Fonts -->
    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 11.5px;
        fill: #94a3b8;
        line-height: 16px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 9px;
        fill: #fbbf24;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090606"/>
      <stop offset="100%" stop-color="#140f0c"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="blur-bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="410" height="180" rx="16" fill="url(#card-bg)"/>
  
  <!-- Subtle background glow -->
  <circle cx="20" cy="20" r="40" fill="#fbbf24" opacity="0.06" filter="url(#blur-bg)"/>

  <!-- Double-Bezel Inner Core -->
  <rect x="5" y="5" width="400" height="170" rx="12" fill="#050409" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1.25"/>

  <!-- Left Icon Group -->
  <g transform="translate(24, 24)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1"/>
    
    <!-- AI Document Icon (Path) -->
    <path d="M 11 9 L 21 9 L 27 15 L 27 27 L 11 27 Z" stroke="#fbbf24" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 21 9 L 21 15 L 27 15" stroke="#fbbf24" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Tiny sparkles/stars representing AI -->
    <path d="M 15 17 L 17 19 L 15 21 L 13 19 Z" fill="#fbbf24"/>
    <circle cx="21" cy="22" r="1.5" fill="#fbbf24"/>
  </g>

  <!-- Top-Right Link Indicator (Button-in-Button style) -->
  <g transform="translate(354, 24)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <path d="M 12 20 L 20 12 M 14 12 L 20 12 L 20 18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Description -->
  <text x="72" y="47" class="card-title">FDocs</text>
  
  <g transform="translate(24, 76)">
    <text x="0" y="12" class="card-desc">AI-powered reading assistant for PDFs and DOCX files.</text>
    <text x="0" y="28" class="card-desc">Builds semantic study layers, automatic summaries, knowledge</text>
    <text x="0" y="44" class="card-desc">graphs, and conversational RAG using the Gemini API.</text>
  </g>

  <!-- Footer Tags -->
  <!-- Tag 1: FastAPI -->
  <g transform="translate(24, 138)">
    <rect x="0" y="0" width="56" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="28" y="13" text-anchor="middle" class="tag-text" fill="#009688">FastAPI</text>
  </g>

  <!-- Tag 2: React -->
  <g transform="translate(86, 138)">
    <rect x="0" y="0" width="50" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="25" y="13" text-anchor="middle" class="tag-text" fill="#61dafb">React</text>
  </g>

  <!-- Tag 3: pgvector -->
  <g transform="translate(142, 138)">
    <rect x="0" y="0" width="60" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="30" y="13" text-anchor="middle" class="tag-text" fill="#3b82f6">pgvector</text>
  </g>

  <!-- Tag 4: Gemini -->
  <g transform="translate(208, 138)">
    <rect x="0" y="0" width="56" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="28" y="13" text-anchor="middle" class="tag-text" fill="#fbbf24">Gemini</text>
  </g>
</svg>
