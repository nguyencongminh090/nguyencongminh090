<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320" fill="none">
  <defs>
    <!-- Fonts -->
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 14px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 9px;
        fill: #00f2fe;
        letter-spacing: 1.5px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 10px;
        fill: #e2e8f0;
        letter-spacing: 0.5px;
      }
      .board-label {
        font-family: Menlo, Monaco, Consolas, "Fira Code", monospace;
        font-size: 9px;
        fill: #475569;
        font-weight: 500;
      }
      .board-eval {
        font-family: Menlo, Monaco, Consolas, "Fira Code", monospace;
        font-size: 9px;
        fill: #00f2fe;
        font-weight: 600;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030206"/>
      <stop offset="50%" stop-color="#070612"/>
      <stop offset="100%" stop-color="#0e0d1d"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="60%" stop-color="#00f2fe" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a18cd1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing effects -->
    <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur-medium" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="320" rx="20" fill="url(#bg-grad)"/>

  <!-- Glowing Mesh Orbs -->
  <circle cx="120" cy="100" r="100" fill="#7c3aed" opacity="0.15" filter="url(#blur-large)"/>
  <circle cx="280" cy="240" r="120" fill="#00f2fe" opacity="0.12" filter="url(#blur-large)"/>
  <circle cx="680" cy="140" r="130" fill="#a18cd1" opacity="0.18" filter="url(#blur-large)"/>
  <circle cx="500" cy="60" r="80" fill="#ec4899" opacity="0.08" filter="url(#blur-large)"/>

  <!-- Fading Gomoku Grid Overlay (Left & Right) -->
  <g opacity="0.05">
    <path d="M 0,20 L 850,20 M 0,40 L 850,40 M 0,60 L 850,60 M 0,80 L 850,80 M 0,100 L 850,100 M 0,120 L 850,120 M 0,140 L 850,140 M 0,160 L 850,160 M 0,180 L 850,180 M 0,200 L 850,200 M 0,220 L 850,220 M 0,240 L 850,240 M 0,260 L 850,260 M 0,280 L 850,280 M 0,300 L 850,300" stroke="#ffffff" stroke-width="0.5"/>
    <path d="M 40,0 L 40,320 M 80,0 L 80,320 M 120,0 L 120,320 M 160,0 L 160,320 M 200,0 L 200,320 M 240,0 L 240,320 M 280,0 L 280,320 M 320,0 L 320,320 M 360,0 L 360,320 M 400,0 L 400,320 M 440,0 L 440,320 M 480,0 L 480,320 M 520,0 L 520,320 M 560,0 L 560,320 M 600,0 L 600,320 M 640,0 L 640,320 M 680,0 L 680,320 M 720,0 L 720,320 M 760,0 L 760,320 M 800,0 L 800,320" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- Double-Bezel Main Profile Card -->
  <!-- Outer Shell -->
  <rect x="30" y="30" width="790" height="260" rx="24" fill="#0c0c16" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  
  <!-- Inner Core (Glass Enclosure) -->
  <rect x="35" y="35" width="780" height="250" rx="20" fill="#07070f" fill-opacity="0.8" stroke="url(#border-grad)" stroke-width="1.25"/>

  <!-- Left Side: Profile & Title info -->
  <g transform="translate(65, 75)">
    <!-- Micro Eyebrow Tag -->
    <rect x="0" y="0" width="135" height="20" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="url(#pill-border)" stroke-width="1"/>
    <circle cx="10" cy="10" r="3" fill="#00f2fe" filter="url(#glow)"/>
    <text x="22" y="13" class="tag-text">AI RESEARCH &amp; DEV</text>

    <!-- Name -->
    <text x="0" y="55" class="title">Nguyễn Công Minh</text>
    
    <!-- Subtitle / Bio -->
    <text x="0" y="85" class="subtitle">Student @ FPT University · Software Architecture Learner</text>
    <text x="0" y="105" class="subtitle" fill="#64748b">Building high-performance game engines &amp; machine learning solvers</text>

    <!-- Stack Pill Tags -->
    <!-- Pill 1: C++ / Python -->
    <g transform="translate(0, 135)">
      <rect x="0" y="0" width="105" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="url(#pill-border)"/>
      <!-- Small bullet -->
      <circle cx="14" cy="14" r="3" fill="#3b82f6"/>
      <text x="26" y="17" class="pill-text">C++ &amp; Python</text>
    </g>
    
    <!-- Pill 2: Gomoku AI -->
    <g transform="translate(115, 135)">
      <rect x="0" y="0" width="95" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="url(#pill-border)"/>
      <circle cx="14" cy="14" r="3" fill="#00f2fe"/>
      <text x="26" y="17" class="pill-text">Gomoku AI</text>
    </g>

    <!-- Pill 3: Graph Solvers -->
    <g transform="translate(220, 135)">
      <rect x="0" y="0" width="125" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="url(#pill-border)"/>
      <circle cx="14" cy="14" r="3" fill="#a18cd1"/>
      <text x="26" y="17" class="pill-text">Graph Algorithms</text>
    </g>
  </g>

  <!-- Right Side: Tactical Gomoku Evaluation / Engine Visualizer -->
  <g transform="translate(540, 60)">
    <!-- Sub-enclosure for Board -->
    <rect x="0" y="0" width="220" height="200" rx="16" fill="#030307" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    
    <!-- Mini Gomoku Board (Grid Lines) -->
    <g opacity="0.15" transform="translate(20, 20)">
      <!-- Vertical Lines -->
      <line x1="0" y1="0" x2="0" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="20" y1="0" x2="20" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="60" y1="0" x2="60" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="140" y1="0" x2="140" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="120" stroke="#ffffff" stroke-width="1"/>
      <line x1="180" y1="0" x2="180" y2="120" stroke="#ffffff" stroke-width="1"/>
      <!-- Horizontal Lines -->
      <line x1="0" y1="0" x2="180" y2="0" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="20" x2="180" y2="20" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="40" x2="180" y2="40" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="60" x2="180" y2="60" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="80" x2="180" y2="80" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="120" x2="180" y2="120" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Coordinate labels -->
    <text x="20" y="155" class="board-label">H</text>
    <text x="40" y="155" class="board-label">I</text>
    <text x="60" y="155" class="board-label">J</text>
    <text x="80" y="155" class="board-label">K</text>
    <text x="100" y="155" class="board-label">L</text>
    <text x="120" y="155" class="board-label">M</text>
    <text x="140" y="155" class="board-label">N</text>
    <text x="160" y="155" class="board-label">O</text>
    <text x="180" y="155" class="board-label">P</text>
    <text x="200" y="155" class="board-label">Q</text>
    
    <text x="10" y="23" class="board-label">9</text>
    <text x="10" y="43" class="board-label">8</text>
    <text x="10" y="63" class="board-label">7</text>
    <text x="10" y="83" class="board-label">6</text>
    <text x="10" y="103" class="board-label">5</text>
    <text x="10" y="123" class="board-label">4</text>
    <text x="10" y="143" class="board-label">3</text>

    <!-- Tactical Stones & Search evaluation visualization (Rapfi Engine theme) -->
    <!-- Grid offset starts at cx=20, cy=20, spacing=20 -->
    <!-- Black stones (fill slate-900, white highlight) -->
    <circle cx="100" cy="80" r="7.5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="80" cy="100" r="7.5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="100" r="7.5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="7.5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="160" cy="40" r="7.5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- White stones (fill f8fafc, dark highlight) -->
    <circle cx="100" cy="100" r="7.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="120" cy="80" r="7.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="7.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="140" cy="80" r="7.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Engine Threat Highlight Line (cyan glow showing 5-in-a-row or double threat) -->
    <line x1="80" y1="100" x2="160" y2="40" stroke="#00f2fe" stroke-width="2.5" opacity="0.85" filter="url(#glow)"/>
    <circle cx="80" cy="100" r="9" fill="none" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="160" cy="40" r="9" fill="none" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Engine Stats overlay (Rapfi Engine evaluation console) -->
    <g transform="translate(20, 168)" opacity="0.8">
      <text x="0" y="10" class="board-eval">Engine: Rapfi v2.0</text>
      <text x="0" y="22" class="board-eval" fill="#94a3b8">Depth: 24/45  |  Nps: 3.8M</text>
      <!-- Score +inf indicating mate/win found -->
      <text x="130" y="10" class="board-eval" fill="#10b981">Eval: +M12</text>
    </g>
  </g>
</svg>
