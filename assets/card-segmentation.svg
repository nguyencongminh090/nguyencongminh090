<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 180" width="410" height="180" fill="none">
  <defs>
    <!-- Fonts -->
    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 17px;
        fill: #ffffff;
        letter-spacing: 0.5px;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 11.5px;
        fill: #94a3b8;
        line-height: 16px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 9px;
        fill: #f43f5e;
        letter-spacing: 0.5px;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080507"/>
      <stop offset="100%" stop-color="#140c10"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="blur-bg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="410" height="180" rx="16" fill="url(#card-bg)"/>
  
  <!-- Subtle background glow -->
  <circle cx="20" cy="20" r="40" fill="#f43f5e" opacity="0.06" filter="url(#blur-bg)"/>

  <!-- Double-Bezel Inner Core -->
  <rect x="5" y="5" width="400" height="170" rx="12" fill="#050409" fill-opacity="0.9" stroke="url(#card-border)" stroke-width="1.25"/>

  <!-- Left Icon Group -->
  <g transform="translate(24, 24)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#f43f5e" fill-opacity="0.05" stroke="#f43f5e" stroke-opacity="0.15" stroke-width="1"/>
    
    <!-- Graph Network Nodes Icon (Path) -->
    <!-- Nodes -->
    <circle cx="13" cy="13" r="2.5" fill="#f43f5e"/>
    <circle cx="25" cy="11" r="2.5" fill="#f43f5e"/>
    <circle cx="21" cy="23" r="2.5" fill="#f43f5e"/>
    <circle cx="11" cy="25" r="2.5" fill="#f43f5e"/>
    <!-- Edges -->
    <line x1="13" y1="13" x2="25" y2="11" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="13" y1="13" x2="21" y2="23" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="25" y1="11" x2="21" y2="23" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="11" y1="25" x2="21" y2="23" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="11" y1="25" x2="13" y2="13" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- Top-Right Link Indicator (Button-in-Button style) -->
  <g transform="translate(354, 24)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <path d="M 12 20 L 20 12 M 14 12 L 20 12 L 20 18" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Description -->
  <text x="72" y="47" class="card-title">LRFM Max-K-Cut Solver</text>
  
  <g transform="translate(24, 76)">
    <text x="0" y="12" class="card-desc">Graph-theory model solver for customer segmentation.</text>
    <text x="0" y="28" class="card-desc">Features a from-scratch algorithm for NP-hard Max-K-Cut,</text>
    <text x="0" y="44" class="card-desc">validated against mathematical brute-force optimal bounds.</text>
  </g>

  <!-- Footer Tags -->
  <!-- Tag 1: Python -->
  <g transform="translate(24, 138)">
    <rect x="0" y="0" width="56" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="28" y="13" text-anchor="middle" class="tag-text" fill="#3b82f6">Python</text>
  </g>

  <!-- Tag 2: Algorithms -->
  <g transform="translate(86, 138)">
    <rect x="0" y="0" width="76" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="38" y="13" text-anchor="middle" class="tag-text" fill="#f43f5e">Algorithms</text>
  </g>

  <!-- Tag 3: Graph Theory -->
  <g transform="translate(168, 138)">
    <rect x="0" y="0" width="86" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="43" y="13" text-anchor="middle" class="tag-text" fill="#a18cd1">Graph Theory</text>
  </g>

  <!-- Tag 4: Solver -->
  <g transform="translate(260, 138)">
    <rect x="0" y="0" width="54" height="20" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="27" y="13" text-anchor="middle" class="tag-text" fill="#10b981">Solver</text>
  </g>
</svg>
